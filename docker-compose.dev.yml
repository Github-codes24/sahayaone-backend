services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: bank-sahayaone-backend-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:5002:5002"
    env_file:
      - .env
    environment:
      PORT: 5002
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5002/health || wget --spider -q http://127.0.0.1:5002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

