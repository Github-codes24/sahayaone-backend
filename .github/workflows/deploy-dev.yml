name: Deploy Development Backend

on:
  push:
    branches:
      - development

jobs:
  deploy:
    name: Deploy to Development Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Optional CI step: Validate syntax / check dependencies
      - name: Verify package installation
        run: |
          npm ci

      # SSH into Dev Server & Deploy Docker Container
      - name: Deploy to VPS (Dev Environment)
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "Starting deployment on Dev Server..."
            
            # 1. Navigate to project directory
            cd /home/ubuntu/apps/dev/sahayaone-backend
            
            # 2. pull latest changes from dev branch
            git pull origin development
            
            # 3. Build and restart development docker containers
            docker compose -p sahayaone-dev -f docker-compose.dev.yml up -d --build
            
            # 4. Check container status
            docker compose -f docker-compose.dev.yml ps
            
            echo "Development Server Deployed Successfully!"
