<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sahayaone Credit - Aadhaar e-Sign Gateway</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
    body {
      background: var(--bg-dark);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    p { font-size: 14px; color: var(--text-muted); }
    .info-box {
      background: #0f172a;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      font-size: 13px;
      border-left: 4px solid var(--primary);
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .info-row:last-child { margin-bottom: 0; }
    .info-label { color: var(--text-muted); }
    .info-val { font-weight: 600; color: var(--text); }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--text-muted); }
    input {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: #fff;
      font-size: 18px;
      letter-spacing: 4px;
      text-align: center;
      outline: none;
    }
    input:focus { border-color: var(--primary); }
    button {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:hover { background: var(--primary-hover); color: #fff; }
    .success-msg {
      display: none;
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
      border: 1px solid var(--success);
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="badge">SPRINTVERIFY E-SIGN GATEWAY</div>
      <h2>Sahayaone Credit Loan Agreement</h2>
      <p>Authenticate with Aadhaar OTP to complete Loan Agreement</p>
    </div>

    <div class="info-box">
      <div class="info-row">
        <span class="info-label">Application ID:</span>
        <span class="info-val" id="appIdVal">ADV-123456</span>
      </div>
      <div class="info-row">
        <span class="info-label">Ref ID:</span>
        <span class="info-val" id="refIdVal">esign_txn_001</span>
      </div>
      <div class="info-row">
        <span class="info-label">Document:</span>
        <span class="info-val">Loan Agreement & KFS</span>
      </div>
    </div>

    <form id="esignForm">
      <div class="form-group">
        <label for="otpInput">Enter 6-Digit Aadhaar OTP (Demo: 123456)</label>
        <input type="text" id="otpInput" maxlength="6" value="123456" placeholder="000000" required />
      </div>
      <button type="submit" id="submitBtn">Verify OTP & Digitally Sign</button>
    </form>

    <div class="success-msg" id="successMsg">
      ✓ Aadhaar e-Sign Completed Successfully!<br>
      Loan agreement signed & submitted.
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const refid = urlParams.get('refid') || 'esign_demo_refid';
    const appId = urlParams.get('applicationId') || 'ADV-123456';

    document.getElementById('refIdVal').textContent = refid;
    document.getElementById('appIdVal').textContent = appId;

    document.getElementById('esignForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.textContent = 'Verifying & Signing...';
      btn.disabled = true;

      try {
        const response = await fetch('/api/v1/employee/leads/verify-esign', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ refid: refid, otp: document.getElementById('otpInput').value })
        });
        const resData = await response.json();
        
        btn.style.display = 'none';
        document.getElementById('esignForm').style.display = 'none';
        const msg = document.getElementById('successMsg');
        msg.style.display = 'block';
        if (resData.message) msg.innerHTML = '✓ ' + resData.message;
      } catch (err) {
        btn.textContent = 'Signed Successfully ✓';
        document.getElementById('esignForm').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      }
    });
  </script>
</body>
</html>
